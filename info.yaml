# Tiny Tapeout project information
project:
  title:        "Approximate vs. Exact 8x8 Multiplier"      # Project title
  author:       "Sid"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "8x8 Dadda multiplier: mode-selectable exact (true 4:2 compressor) or approximate (2-output compressor + LOA) core"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_sidisnotacoder_approx_mult"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "half_adder.v"
    - "full_adder.v"
    - "exact_4to2_compressor.v"
    - "approx_4to2_compressor_p2.v"
    - "dadda_multiplier_8x8_true4to2.v"
    - "dadda_multiplier_8x8_approx_p2_t10_loa.v"
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "operand byte bit 0 (A on load phase 0, B on load phase 1)"
  ui[1]: "operand byte bit 1 (A on load phase 0, B on load phase 1)"
  ui[2]: "operand byte bit 2 (A on load phase 0, B on load phase 1)"
  ui[3]: "operand byte bit 3 (A on load phase 0, B on load phase 1)"
  ui[4]: "operand byte bit 4 (A on load phase 0, B on load phase 1)"
  ui[5]: "operand byte bit 5 (A on load phase 0, B on load phase 1)"
  ui[6]: "operand byte bit 6 (A on load phase 0, B on load phase 1)"
  ui[7]: "operand byte bit 7 (A on load phase 0, B on load phase 1)"

  # Outputs
  uo[0]: "product[8]"
  uo[1]: "product[9]"
  uo[2]: "product[10]"
  uo[3]: "product[11]"
  uo[4]: "product[12]"
  uo[5]: "product[13]"
  uo[6]: "product[14]"
  uo[7]: "product[15]"

  # Bidirectional pins
  uio[0]: "mode select (0=exact,1=approx) during load phase 0; product[0] during output phase"
  uio[1]: "product[1] during output phase (input, unused, during load phases)"
  uio[2]: "product[2] during output phase (input, unused, during load phases)"
  uio[3]: "product[3] during output phase (input, unused, during load phases)"
  uio[4]: "product[4] during output phase (input, unused, during load phases)"
  uio[5]: "product[5] during output phase (input, unused, during load phases)"
  uio[6]: "product[6] during output phase (input, unused, during load phases)"
  uio[7]: "product[7] during output phase (input, unused, during load phases)"

# Do not change!
yaml_version: 6
